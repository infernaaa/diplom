<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Athlete List</title>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .button-container {
            margin-bottom: 20px;
        }

        .button-container button {
            margin-right: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .details-button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .details-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div th:replace="~{topButtons :: menu}"></div>

<h1>Список спортсменов</h1>

<table>
    <thead>
    <tr>
        <th>ФИО</th>
        <th>Дата рождениия</th>
        <th>Ранг</th>
        <th>Категория</th>
        <th>Клуб</th>
        <th>Действие</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="athlete : ${athletes}">
        <td th:text="${athlete.fio}"></td>
        <td th:text="${athlete.bday}"></td>
        <td th:text="${athlete.rank}"></td>
        <td th:text="${athlete.category}"></td>
        <td th:text="${athlete.idClub.getName()}"></td>
        <td>
            <a th:href="@{/athletes/{id}(id=${athlete.id})}" class="button">Подробно</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
