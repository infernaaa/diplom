<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Athlete Selection</title>
</head>
<body>
<form th:action="@{/sportclubs/{id}/newAppCreate(id=${id})}"
      th:object="${applicationForm}"
      method="post">

    <!-- Выбор атлета (используем th:field для привязки к DTO) -->
    <select th:field="*{athleteId}">
        <option value="">-- Выберите атлета --</option>
        <option th:each="athlete : ${athleteList}"
                th:value="${athlete.id}"
                th:text="${athlete.fio}">
        </option>
    </select>

    <!-- Выбор турнира (используем th:field для привязки к DTO) -->
    <select th:field="*{tourId}">
        <option value="">-- Выберите турнир --</option>
        <option th:each="tour : ${tourList}"
                th:value="${tour.id}"
                th:text="${tour.name}">
        </option>
    </select>

    <button type="submit">Отправить</button>
</form>
</body>
</html>
