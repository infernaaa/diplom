<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<head>
    <title>Tournaments List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>

<div th:replace="~{topButtons :: menu}"></div>

<div class="container">
    <h1>Список соревнований</h1>
    <table>
        <thead>
        <tr>
            <th>Наименование</th>
            <th>Дата начала</th>
            <th>Дата конца</th>
            <th>Место проведения</th>
            <th>Описание</th>
            <th>Правила</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tournamentModel : ${tournamentModel}">
            <td th:text="${tournamentModel.name}"></td>
            <td th:text="${tournamentModel.startDate}"></td>
            <td th:text="${tournamentModel.endDate}"></td>
            <td th:text="${tournamentModel.location}"></td>
            <td th:text="${tournamentModel.description}"></td>
            <td th:text="${tournamentModel.rules}"></td>
            <td>
                <a th:href="@{/tournaments/{id}(id=${tournamentModel.id})}" class="button">Подробно</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
