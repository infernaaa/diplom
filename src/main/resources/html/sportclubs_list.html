<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SportClubs List</title>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .button-container {
            margin-bottom: 20px;
        }

        .button-container button {
            margin-right: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .details-button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .details-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="button-container">
    <button onclick="window.location.href='/sportclubs'">Спортивные клубы</button>
    <button onclick="window.location.href='/app'">Заявки</button>
    <button onclick="window.location.href='/tournaments'">Соревнования</button>
    <button onclick="window.location.href='/app'">Спортсмены</button>
</div>

<h1>Список клубов</h1>

<table>
    <thead>
    <tr>
        <th>Наименование</th>
        <th>Адрес</th>
        <th>Контактный номер телефона</th>
        <th>Подробно</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sportclub : ${SportClubs}">
        <td th:text="${sportclub.name}"></td>
        <td th:text="${sportclub.address}"></td>
        <td th:text="${sportclub.phoneClub}"></td>
        <td>
            <a th:href="@{/sportclubs/{id}(id=${sportclub.id})}" class="button">Подробно</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
