<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SportClub Details</title>
    <meta charset="UTF-8">
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .container {
            width: 50%;
            text-align: left;
        }

        h1 {
            text-align: left;
        }
        .button-container {
            margin-bottom: 20px;
        }

        .button-container button {
            margin-right: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="button-container">
    <button onclick="window.location.href='/sportclubs'">Спортивные клубы</button>
    <button onclick="window.location.href='/app'">Заявки</button>
    <button onclick="window.location.href='/tournaments'">Соревнования</button>
    <button onclick="window.location.href='/app'">Спортсмены</button>
</div>
<div class="add-athlete-form">
    <h3>Добавить спортсмена</h3>
    <form th:action="@{/sportclubs/{clubId}/athletes/new(clubId=${sportclub.id})}" method="post">

        <input type="text" name="name" placeholder="Имя" required>

        <input type="date" name="bday" placeholder="Дата рождения" required>

        <select name="rank" required>
            <option value="" disabled selected>Выберите разряд</option>
            <option value="first">первый</option>
            <option value="second">второй</option>
            <option value="third">третий</option>
        </select>

        <select name="category" required>
            <option value="" disabled selected>Выберите категорию</option>
            <option value="CHILD">Ребенок</option>
            <option value="JUNIOR">Юниор</option>
            <option value="ADULT">Взрослый</option>
        </select>
        <button type="submit">Добавить</button>
    </form>
</div>
<div class="container">
    <h1>Информация о клубе</h1>
    <table>
        <tr>
            <th>Наименования</th>
            <td th:text="${sportclub.name}"></td>
        </tr>
        <tr>
            <th>Адрес</th>
            <td th:text="${sportclub.address}"></td>
        </tr>
        <tr>
            <th>Контактный номер телефона</th>
            <td th:text="${sportclub.phoneClub}"></td>
        </tr>
    </table>

    <h2>Спортсмены в клубе</h2>
    <table>
        <thead>
        <tr>
            <th>ФИО</th>
            <th>День рождения</th>
            <th>Ранг</th>
            <th>Категория</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="athlete : ${athletes}">
            <td th:text="${athlete.fio}"></td>
            <td th:text="${athlete.bday}"></td>
            <td th:text="${athlete.rank}"></td>
            <td th:text="${athlete.category}"></td>
            <td>
                <form th:action="@{/sportclubs/{clubId}/athletes/{id}/delete(clubId=${sportclub.id}, id=${athlete.id})}"
                      method="post">
                    <input type="hidden" name="_method" value="delete">
                    <button type="submit" class="button">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
