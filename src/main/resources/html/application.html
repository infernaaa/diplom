<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Application List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
<div th:replace="~{topButtons :: menu}"></div>
<div class="container">
    <h1>Список заявок</h1>
    <table>
        <thead>
        <tr>
            <th>Турнир</th>
            <th>Спортивный клуб заявителя</th>
            <th>Команда</th>
            <th>Атлет</th>
            <th>Статус заявки</th>
            <th>Дата подачи</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="applicationsDTO : ${applicationsDTO}">
            <td th:text="${applicationsDTO.tour.getName()}"></td>
            <td th:text="${applicationsDTO.sportClub.getName()}"></td>
            <td th:text="${applicationsDTO.team.getTeamName()}"></td>
            <td th:text="${applicationsDTO.athlete.getFio()}"></td>
            <td th:text="${applicationsDTO.status}"></td>
            <td th:text="${applicationsDTO.date}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
